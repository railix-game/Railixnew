name: Wire NFT contract address into mint section

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire NFT address
        run: |
          python3 - << 'PYEOF'
          import re
          s = open('index.html', encoding='utf-8').read()
          old = "const RXN = '0x0000000000000000000000000000000000000000';"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, "const RXN = '0x9218733FC1af2a6cA57CA6f888b80028e91D4640';", 1)
          open('index.html', 'w', encoding='utf-8').write(s)
          sc = re.search(r'<script>(.*?)</script>', s, re.DOTALL).group(1)
          open('/tmp/check.js', 'w').write(sc)
          print('NFT address wired')
          PYEOF
          node --check /tmp/check.js && echo 'JS SYNTAX OK'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Wire NFT contract address into mint section"
          git push
