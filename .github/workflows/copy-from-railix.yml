name: Copy files from Railix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Railix files
        run: |
          git clone --depth 1 https://github.com/railix-game/Railix railix-src
          rsync -a --exclude '.git' railix-src/ ./
          rm -rf railix-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Copy files from railix-game/Railix"
          git push
