name: Add X contact link to footer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contact link
        run: |
          python3 - << 'PYEOF'
          import re
          s = open('index.html', encoding='utf-8').read()
          old = '  <span>RAILIX · SERIES I · 4,444 LINES</span>'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, old + '\n  <span>Contact: <a href="https://x.com/Railixagentic">@Railixagentic</a> on X</span>', 1)
          open('index.html', 'w', encoding='utf-8').write(s)
          sc = re.search(r'<script>(.*?)</script>', s, re.DOTALL).group(1)
          open('/tmp/check.js', 'w').write(sc)
          print('contact link added')
          PYEOF
          node --check /tmp/check.js && echo 'JS SYNTAX OK'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add X contact link to footer"
          git push
