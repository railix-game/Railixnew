name: Show mint-gets-token note on web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add token note and fix FAQ
        run: |
          python3 - << 'PYEOF'
          import re
          s = open('index.html', encoding='utf-8').read()
          old1 = 'there is no eligibility list: anyone can mint within the phase and the per-mint max.</p>'
          assert s.count(old1) == 1, s.count(old1)
          s = s.replace(old1, old1 + '\n    <p class="body">Mint = get token: every NFT minted also grants <b>1,000 RAIL</b> automatically, in the same transaction. No claim, no extra fee.</p>', 1)
          old2 = '<p>A rail line, drawn. No token, no roadmap, no promises.</p>'
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old2, '<p>A rail line, drawn, plus <b>1,000 RAIL</b> per mint, automatically in the same transaction. No roadmap, no other promises.</p>', 1)
          open('index.html', 'w', encoding='utf-8').write(s)
          sc = re.search(r'<script>(.*?)</script>', s, re.DOTALL).group(1)
          open('/tmp/check.js', 'w').write(sc)
          print('token note added, FAQ fixed')
          PYEOF
          node --check /tmp/check.js && echo 'JS SYNTAX OK'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Show mint-gets-token note on web and fix FAQ"
          git push
