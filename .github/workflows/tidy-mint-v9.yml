          import re
          s = open('index.html', encoding='utf-8').read()
          assert "mx-div" in s and "mx-err" in s
          assert "Exchange · soon" not in s and "Coming soon" not in s
          assert "mxConnect" in s and "mxMintBtn" in s
          sc = re.search(r'<script>(.*?)</script>', s, re.DOTALL).group(1)
          open('/tmp/check.js', 'w').write(sc)
          print('tidy present')
          PYEOF
          node --check /tmp/check.js && echo 'JS SYNTAX OK'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Tidy mint section and open exchange board"
          git push
